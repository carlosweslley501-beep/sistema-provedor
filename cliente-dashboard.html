<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta - Sistema Provedor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <aside class="menu">
            <h2>🌐 Provedor</h2>
            <nav>
                <a href="#">📋 Meu Histórico</a>
            </nav>
            <button onclick="sair()">Sair</button>
        </aside>

        <main class="conteudo">

            <header>
                <div>
                    <h1>Minha Conta</h1>
                    <p id="boasVindas">Bem-vindo!</p>
                </div>
                <div class="perfil" id="perfilNome">👤</div>
            </header>

            <section class="historico">
                <h2>Histórico de Pagamentos</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Mês</th>
                            <th>Valor</th>
                            <th>Status</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaFaturas">
                    </tbody>
                </table>
            </section>

        </main>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const dados = JSON.parse(localStorage.getItem("clienteLogado"));

        if (!dados) {
            window.location.href = "index.html";
        } else {
            document.getElementById("boasVindas").textContent = "Bem-vindo, " + dados.nome + ".";
            document.getElementById("perfilNome").textContent = "👤 " + dados.nome;

            carregarFaturas(dados.id);
        }

        async function carregarFaturas(clienteId) {
            const faturasRef = collection(db, "faturas");
            const q = query(faturasRef, where("clienteId", "==", clienteId));
            const resultado = await getDocs(q);

            const tabela = document.getElementById("tabelaFaturas");
            tabela.innerHTML = "";

            const statusTexto = { pago: "Pago", pendente: "Pendente", atrasado: "Atrasado" };

            const faturas = [];
            resultado.forEach((doc) => faturas.push(doc.data()));
            faturas.sort((a, b) => new Date(b.data) - new Date(a.data));

            faturas.forEach((f) => {
                const dataFormatada = new Date(f.data + "T00:00:00").toLocaleDateString("pt-BR");
                tabela.innerHTML += `
                    <tr>
                        <td>${f.mes}</td>
                        <td>R$ ${f.valor.toFixed(2).replace(".", ",")}</td>
                        <td class="${f.status}">${statusTexto[f.status]}</td>
                        <td>${dataFormatada}</td>
                    </tr>
                `;
            });

            if (faturas.length === 0) {
                tabela.innerHTML = "<tr><td colspan='4' style='text-align:center; color:#94a3b8;'>Nenhuma fatura encontrada.</td></tr>";
            }
        }

        function sair() {
            localStorage.removeItem("clienteLogado");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
