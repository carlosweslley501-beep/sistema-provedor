<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Provedor - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Sistema Provedor</h1>
            <p>Faça login para acessar o sistema</p>

            <div class="campo">
                <label for="cpf">Login / CPF</label>
                <input 
                    type="text" 
                    id="cpf" 
                    placeholder="Digite seu login ou CPF"
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    placeholder="Digite sua senha"
                >
            </div>

            <button onclick="fazerLogin()">Entrar</button>

            <p id="mensagem"></p>

        </div>

    </div>

    <script
        src="login.js">

    </script>

</body>
</html>
