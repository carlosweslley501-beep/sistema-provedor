<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Cliente - Sistema Provedor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Cadastrar Cliente</h1>
            <p>Preencha os dados do novo cliente</p>

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Nome do cliente">
            </div>

            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="Somente números" maxlength="14">
            </div>

            <div class="campo">
                <label for="senha">Senha padrão</label>
                <input type="text" id="senha" placeholder="Ex: 1234">
            </div>

            <div class="campo">
                <label for="plano">Plano</label>
                <input type="text" id="plano" placeholder="Ex: Fibra 200MB">
            </div>

            <div class="campo">
                <label for="valor">Valor da mensalidade</label>
                <input type="number" id="valor" placeholder="Ex: 99.90" step="0.01">
            </div>

            <button onclick="cadastrarCliente()">Cadastrar</button>
            <p id="mensagem"></p>
            <p style="text-align:center; margin-top:15px;">
                <a href="dashboard.html" style="color:#38bdf8;">Voltar ao painel</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        window.cadastrarCliente = async function () {
            const nome = document.getElementById("nome").value.trim();
            const cpfDigitado = document.getElementById("cpf").value;
            const cpf = cpfDigitado.replace(/\D/g, "");
            const senha = document.getElementById("senha").value.trim();
            const plano = document.getElementById("plano").value.trim();
            const valor = parseFloat(document.getElementById("valor").value);
            const mensagem = document.getElementById("mensagem");

            if (!nome || !cpf || !senha || !plano || isNaN(valor)) {
                mensagem.style.color = "red";
                mensagem.textContent = "Preencha todos os campos corretamente.";
                return;
            }

            try {
                await addDoc(collection(db, "clientes"), {
                    nome: nome,
                    cpf: cpf,
                    senha: senha,
                    plano: plano,
                    valorMensalidade: valor,
                    faturas: [],
                    criadoEm: new Date().toISOString()
                });

                mensagem.style.color = "lightgreen";
                mensagem.textContent = "Cliente cadastrado com sucesso!";

                document.getElementById("nome").value = "";
                document.getElementById("cpf").value = "";
                document.getElementById("senha").value = "";
                document.getElementById("plano").value = "";
                document.getElementById("valor").value = "";
            } catch (erro) {
                mensagem.style.color = "red";
                mensagem.textContent = "Erro ao cadastrar: " + erro.message;
            }
        };
    </script>
</body>
</html>
