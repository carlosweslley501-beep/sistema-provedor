<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Cliente - Sistema Provedor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Cadastrar Cliente</h1>
            <p>Preencha os dados do novo cliente</p>

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Nome do cliente">
            </div>

            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="Somente números" maxlength="14">
            </div>

            <div class="campo">
                <label for="senha">Senha padrão</label>
                <input type="text" id="senha" placeholder="Ex: 1234">
            </div>

         <div class="campo">
               <label for="rua">Rua</label>
               <input type="text" id="rua" placeholder="Ex: Rua das Flores">
          </div>

            <div class="campo">
    <label for="numero">Número</label>
    <input type="text" id="numero" placeholder="Ex: 123">
          </div>

        <div class="campo">
             <label for="referencia">Ponto de referência</label>
             <input type="text" id="referencia" placeholder="Ex: Perto da padaria">
        </div>

            <div class="campo">
                <label for="plano">Plano</label>
                <input type="text" id="plano" placeholder="Ex: Fibra 200MB">
            </div>

            <div class="campo">
                <label for="valor">Valor da mensalidade</label>
                <input type="number" id="valor" placeholder="Ex: 99.90" step="0.01">
            </div>

            <button onclick="cadastrarCliente()">Cadastrar</button>
            <p id="mensagem"></p>
            <p style="text-align:center; margin-top:15px;">
                <a href="#" onclick="voltarAopainel()" style="color:#38bdf8; cursor: pointer;">Voltar ao painel</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        window.cadastrarCliente = async function () {
            const rua = document.getElementById("rua").value.trim();
            const numero = document.getElementById("numero").value.trim();
            const referencia = document.getElementById("referencia").value.trim();
            const nome = document.getElementById("nome").value.trim();
            const cpfDigitado = document.getElementById("cpf").value;
            const cpf = cpfDigitado.replace(/\D/g, "");
            const senha = document.getElementById("senha").value.trim();
            const plano = document.getElementById("plano").value.trim();
            const valor = parseFloat(document.getElementById("valor").value);
            const mensagem = document.getElementById("mensagem");

            if (!nome || !cpf || !senha || !plano || isNaN(valor) || !rua || !numero || !referencia) {
                mensagem.style.color = "red";
                mensagem.textContent = "Preencha todos os campos corretamente.";
                return;
            }

            try {
                await addDoc(collection(db, "clientes"), {
                    nome: nome,
                    cpf: cpf,
                    senha: senha,
                    rua: rua,
                    numero: numero,
                    referencia: referencia,
                    plano: plano,
                    valorMensalidade: valor,
                    faturas: [],
                    criadoEm: new Date().toISOString()
                });

                mensagem.style.color = "lightgreen";
                mensagem.textContent = "Cliente cadastrado com sucesso!";

                document.getElementById("nome").value = "";
                document.getElementById("cpf").value = "";
                document.getElementById("senha").value = "";
                document.getElementById("plano").value = "";
                document.getElementById("valor").value = "";
                document.getElementById("rua").value = "";
                document.getElementById("numero").value = "";
                document.getElementById("referencia").value = "";
            } catch (erro) {
                mensagem.style.color = "red";
                mensagem.textContent = "Erro ao cadastrar: " + erro.message;
            }
        };
        window.voltarAopainel = function () {
            const dados = JSON.parse(localStorage.getItem("funcionarioLogado"));
            if (dados && dados.permissao === "ADM") {
                window.location.href = "dashboard.html";
            } else {
                window.location.href = "funcionario-dashboard.html";
            }
        }
    </script>
</body>
</html>
